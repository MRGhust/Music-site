name: Build and integration test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test server
        run: |
          npm start > /tmp/hamava.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ && break || sleep 1; done
          npm test
